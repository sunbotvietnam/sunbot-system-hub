 visual:`<div class="visual-label">4 ĐIỂM CẦN NHÌN</div><div class="option-grid"><div class="option reco"><div class="tag">01</div><b>Nhân sự có vận hành được không?</b><p>Thời gian tìm nguồn · tỷ lệ đạt sau đào tạo · độ ổn định khi đứng lớp</p></div><div class="option"><div class="tag">02</div><b>Trường có tổ chức được không?</b><p>Lịch · lớp · phụ huynh · hồ sơ · phối hợp nội bộ</p></div><div class="option"><div class="tag">03</div><b>Chất lượng có giữ được không?</b><p>QA lớp học · mức độ thực hiện đúng chương trình · hỗ trợ giáo viên</p></div><div class="option"><div class="tag">04</div><b>Mô hình có mở rộng được không?</b><p>Chi phí vận hành · mức phụ thuộc Sunbot · khả năng nhân rộng</p></div></div>`,
 side:[['Đầu ra pilot','Quy trình nhân sự, thu–chi, phân vai và QA đủ rõ để triển khai lại ở trường khác.'],['Giá trị hệ thống','Giảm tâm lý sợ sai của trường và giảm phụ thuộc vào xử lý tình huống riêng lẻ.']],
 laws:[
 ['QĐ 44/2026','UBND Nghệ An','Khung thu–chi địa phương là nền để thiết kế pilot trường công.','https://thuvienphapluat.vn/van-ban/Tai-chinh-nha-nuoc/Quyet-dinh-44-2026-QD-UBND-khoan-thu-dich-vu-tuyen-sinh-trong-co-so-giao-duc-cong-lap-Nghe-An-714433.aspx','THAM CHIẾU'],
 ['NĐ 235/2026','Chính phủ','Đối chiếu cơ chế nhân sự/hợp đồng trong quá trình pilot.','https://vanban.chinhphu.vn/?classid=0&docid=218614&pageid=27160','CHÍNH THỨC']]
}
];
let active=0;const $=s=>document.querySelector(s);
function renderSteps(){$('#steps').innerHTML=items.map((x,i)=>`<button class="step ${i===active?'active':''}" data-i="${i}"><span class="n">0${i+1}</span><b>${x.short}</b><small>${x.sub}</small></button>`).join('');document.querySelectorAll('.step').forEach(b=>b.onclick=()=>{active=+b.dataset.i;render()})}
function sourceClass(s){return s==='CHÍNH THỨC'?'src':'src ref'}
function renderBoard(){const x=items[active];$('#board').innerHTML=`<div class="board-head"><div><div class="kicker">${x.kicker}</div><h2 class="title">${x.title}</h2><p class="lead">${x.lead}</p></div><div class="confirm"><b>NÚT THẮT</b><p>${x.confirm}</p></div></div><div class="layout"><section class="visual">${x.visual}</section><aside class="side">${x.side.map(s=>`<div class="box"><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('')}</aside></div><section class="laws"><div class="laws-head"><h3>Căn cứ pháp lý & nguồn đối chiếu</h3><span>Bấm vào văn bản để mở nguồn</span></div><div class="law-grid">${x.laws.map(l=>`<a class="law" href="${l[3]}" target="_blank" rel="noopener"><div class="law-icon">VB</div><div><b>${l[0]} · ${l[1]}</b><p>${l[2]}</p></div><span class="${sourceClass(l[4])}">${l[4]}</span></a>`).join('')}</div></section>`;$('#prev').disabled=active===0;$('#next').textContent=active===items.length-1?'Về vấn đề 1 ↺':'Vấn đề tiếp →'}
function render(){renderSteps();renderBoard()}
$('#prev').onclick=()=>{if(active>0){active--;render()}};$('#next').onclick=()=>{active=active===items.length-1?0:active+1;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){active=active===items.length-1?0:active+1;render()}if(e.key==='ArrowLeft'&&active>0){active--;render()}});render();
</script>
</body></html>
